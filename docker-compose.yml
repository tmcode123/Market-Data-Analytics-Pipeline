services:
  postgres:
    image: postgres:18-alpine
    container_name: market_postgres
    environment:
      POSTGRES_DB: testDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testDB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  etl:
    build: .
    container_name: market_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: testDB
      POSTGRES_USER: postgres

volumes:
  postgres_data: